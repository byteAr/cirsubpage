# Sitio público de CIRSUB, para el nginx del sistema operativo.
#
# Un solo dominio para todo: el sitio, la API en /api y los medios en /medios.
# Mismo origen, así que no hay CORS y la cookie de sesión queda atada al sitio.
#
# Se instala copiándolo a /etc/nginx/sites-available/<dominio> y enlazándolo en
# sites-enabled. Antes de activarlo hay que reemplazar dos marcadores: DOMINIO
# por el dominio, y RUTA_MEDIOS por la ruta absoluta de la carpeta `medios` del
# proyecto, sin barra final.
#
# El certificado lo agrega certbot al correr:
#   certbot --nginx -d DOMINIO

# La cabecera `Connection` de la conexión con Node: sólo vale «upgrade» cuando
# el cliente pidió cambiar de protocolo. Puesta a mano en todos los pedidos,
# como estaba, se anunciaba una negociación que nunca ocurría.
map $http_upgrade $conexion_upgrade {
    default upgrade;
    ''      close;
}

# Comprimir lo que se sirve. El HTML renderizado son decenas de kilobytes de
# texto y baja a una fracción; las imágenes ya vienen comprimidas y se saltean.
gzip              on;
gzip_vary         on;
gzip_proxied      any;
gzip_comp_level   5;
gzip_min_length   1024;
gzip_types        text/plain text/css text/xml application/javascript
                  application/json application/xml application/rss+xml
                  image/svg+xml application/manifest+json;

server {
    listen 80;
    listen [::]:80;
    server_name DOMINIO;

    # Certbot necesita este camino libre para renovar.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name DOMINIO;

    # certbot completa las dos líneas del certificado al ejecutarse.

    # Detrás de Cloudflare la IP del visitante llega en esta cabecera; sin esto
    # el registro y el limitador de intentos verían siempre la IP del proxy.
    real_ip_header CF-Connecting-IP;
    set_real_ip_from 0.0.0.0/0;

    client_max_body_size 20m;

    access_log /var/log/nginx/DOMINIO.access.log;
    error_log  /var/log/nginx/DOMINIO.error.log;

    # ── Medios ───────────────────────────────────────────────────────────────
    # Las imágenes las sirve nginx directo del disco, sin pasar por Node.
    #
    # Sin `try_files`: con `alias` no aporta nada —si el archivo no está, nginx
    # responde 404 igual— y en cambio convierte cualquier fallo al abrirlo, un
    # permiso denegado incluido, en un 404 liso que esconde la causa real.
    location /medios/ {
        alias RUTA_MEDIOS/;
        access_log off;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # ── API ──────────────────────────────────────────────────────────────────
    location /api/ {
        proxy_pass http://127.0.0.1:3400/api/;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Las subidas de imágenes pueden tardar más que el minuto por defecto.
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # ── Sitio ────────────────────────────────────────────────────────────────
    # Node renderiza en el servidor, así que todo lo demás va al contenedor web.
    location / {
        proxy_pass http://127.0.0.1:4400;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Las demás `X-Forwarded-*` se borran a propósito, y no es un detalle.
        #
        # Angular sólo renderiza en el servidor si toda `X-Forwarded-*` que
        # recibe está entre las que declaró confiar; con una sola de más entrega
        # la página vacía para que se arme en el navegador. Nginx reenvía tal
        # cual las cabeceras del pedido original, así que tanto Cloudflare —que
        # agrega `X-Forwarded-For`— como cualquier visitante que las mande a
        # mano bastaban para dejar al sitio sin renderizar. Un valor vacío hace
        # que nginx no mande la cabecera.
        proxy_set_header X-Forwarded-For    "";
        proxy_set_header X-Forwarded-Host   "";
        proxy_set_header X-Forwarded-Port   "";
        proxy_set_header X-Forwarded-Prefix "";

        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $conexion_upgrade;
    }
}
