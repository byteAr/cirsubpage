# API del sitio.
#
# Copiar a /etc/nginx/sites-available/apipage.cirsubgn.org.ar y enlazar.
# El certificado se emite con:
#   certbot --nginx -d apipage.cirsubgn.org.ar

server {
    listen 80;
    listen [::]:80;
    server_name apipage.cirsubgn.org.ar;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name apipage.cirsubgn.org.ar;

    ssl_certificate     /etc/letsencrypt/live/apipage.cirsubgn.org.ar/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/apipage.cirsubgn.org.ar/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Tiene que aguantar la subida de imágenes y videos cortos.
    client_max_body_size 50M;

    access_log /var/log/nginx/apipage.access.log;
    error_log  /var/log/nginx/apipage.error.log;

    add_header X-Content-Type-Options nosniff always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location / {
        proxy_pass http://127.0.0.1:3400;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        # Sin X-Real-IP la API ve todo viniendo de 127.0.0.1 y el límite de
        # intentos de ingreso termina bloqueando a todos los usuarios juntos.
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_request_buffering off;
    }
}
