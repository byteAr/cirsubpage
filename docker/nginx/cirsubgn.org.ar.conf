# Sitio público. Reemplaza al archivo `cirsubapp`.
#
# Se conservan dos cosas del archivo viejo: el límite de cuerpo de 50 MB y el
# bloque de git con autenticación básica. El destino cambia del proceso suelto
# del puerto 3005 al contenedor del 4400.
#
# Copiar a /etc/nginx/sites-available/cirsubgn.org.ar y enlazar en sites-enabled.
# Después: nginx -t && systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name cirsubgn.org.ar www.cirsubgn.org.ar;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name cirsubgn.org.ar www.cirsubgn.org.ar;

    ssl_certificate     /etc/letsencrypt/live/cirsubgn.org.ar/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cirsubgn.org.ar/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 50M;

    access_log /var/log/nginx/cirsubgn.org.ar.access.log;
    error_log  /var/log/nginx/cirsubgn.org.ar.error.log;

    # Cabeceras de seguridad. La política de contenido se deja afuera por ahora:
    # conviene medirla con el sitio andando antes de activarla.
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Repositorio git, tal como estaba en el archivo anterior.
    location ~ ^/git(/.*)$ {
        auth_basic           "Git Circulo";
        auth_basic_user_file /etc/nginx/git.htpasswd;

        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME  /usr/lib/git-core/git-http-backend;
        fastcgi_param GIT_HTTP_EXPORT_ALL "";
        fastcgi_param GIT_PROJECT_ROOT /srv/git;
        fastcgi_param PATH_INFO        $1;
        fastcgi_param REMOTE_USER      $remote_user;
        fastcgi_read_timeout 300;
        client_max_body_size 0;
        fastcgi_pass unix:/run/fcgiwrap.socket;
    }

    # Los medios los sirve nginx directo desde el volumen de Docker: Node solo
    # recibe la subida. El prefijo no pisa el bloque /git de arriba.
    location /medios/ {
        alias /var/lib/docker/volumes/cirsubpage_medios/_data/;
        access_log off;
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # El sitio, con renderizado en servidor.
    location / {
        proxy_pass http://127.0.0.1:4400;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        'upgrade';
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
    }
}
