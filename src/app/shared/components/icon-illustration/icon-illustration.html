<div class="icon-wrapper">
  <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" class="icon-svg" aria-hidden="true">
    <defs>
      <linearGradient [attr.id]="gradientId()" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" [attr.stop-color]="colorFrom()" />
        <stop offset="100%" [attr.stop-color]="colorTo()" />
      </linearGradient>
    </defs>

    <!-- Círculo de fondo con gradiente -->
    <circle cx="50" cy="50" r="46" [attr.fill]="'url(#' + gradientId() + ')'" class="bg-circle" />

    <!-- Ícono blanco centrado sobre el círculo (bbox 56×56) -->
    <g class="icon-content">
      @switch (name()) {

        @case ('asesoramiento-contable') {
          <svg x="22" y="22" width="56" height="56" viewBox="0 0 24 24">
            <path fill="none" stroke="#ffffff" stroke-width="2"
                  d="M16 16c0-1.105-3.134-2-7-2s-7 .895-7 2s3.134 2 7 2s7-.895 7-2ZM2 16v4.937C2 22.077 5.134 23 9 23s7-.924 7-2.063V16M9 5c-4.418 0-8 .895-8 2s3.582 2 8 2M1 7v5c0 1.013 3.582 2 8 2M23 4c0-1.105-3.1-2-6.923-2s-6.923.895-6.923 2s3.1 2 6.923 2S23 5.105 23 4Zm-7 12c3.824 0 7-.987 7-2V4M9.154 4v10.166M9 9c0 1.013 3.253 2 7.077 2S23 10.013 23 9" />
          </svg>
        }

        @case ('asesoramiento-juridico') {
          <svg x="22" y="22" width="56" height="56" viewBox="0 0 24 24">
            <g fill="none" stroke="#ffffff" stroke-width="1.5">
              <path stroke-linecap="round" stroke-linejoin="round"
                    d="M12 5v17m0 0H9m3 0h3m6-9l-2.5-5l-2.5 5m-8 0L5.5 8L3 13" />
              <path stroke-linecap="round" stroke-linejoin="round"
                    d="M4 8h1.048c1.264 0 2.49-.529 3.476-1.5c2.032-2 4.92-2 6.952 0c.986.971 2.212 1.5 3.476 1.5H20" />
              <path d="M18.5 17c1.355 0 2.534-.834 3.147-2.065c.331-.665.496-.997.195-1.466C21.54 13 21.04 13 20.04 13h-3.082c-.999 0-1.499 0-1.8.469c-.302.469-.137.801.194 1.466C15.966 16.166 17.145 17 18.5 17Zm-13 0c1.355 0 2.534-.834 3.147-2.065c.331-.665.496-.997.195-1.466C8.54 13 8.04 13 7.04 13H3.959c-.999 0-1.499 0-1.8.469c-.302.469-.137.801.194 1.466C2.966 16.166 4.145 17 5.5 17Zm8-13.5a1.5 1.5 0 1 1-3 0a1.5 1.5 0 0 1 3 0Z" />
            </g>
          </svg>
        }

        @case ('bodas-de-oro') {
          <svg x="22" y="22" width="56" height="56" viewBox="0 0 24 24">
            <g fill="none" stroke="#ffffff" stroke-linejoin="round" stroke-width="1.5">
              <circle cx="8.5" cy="16.5" r="5.5" stroke-linecap="round" />
              <circle cx="15.5" cy="16.5" r="5.5" stroke-linecap="round" />
              <path d="M12 9s4-1.853 4-4.861C16 2.958 15.158 2 14 2c-.947 0-1.579.412-2 1.235C11.579 2.412 10.947 2 10 2c-1.158 0-2 .958-2 2.139C8 7.147 12 9 12 9Z" />
            </g>
          </svg>
        }

        @case ('subsidio-casamiento') {
          <!-- Diseño minimalista propio: dos figuras (novia con velo, novio con moño) + corazón -->
          <svg x="22" y="22" width="56" height="56" viewBox="0 0 24 24">
            <g fill="#ffffff">
              <!-- Corazón pequeño arriba al centro -->
              <path d="M12 2.6c-.4-.7-1.7-.7-1.7.5 0 .9 1.7 2.2 1.7 2.2s1.7-1.3 1.7-2.2c0-1.2-1.3-1.2-1.7-.5Z" />
              <!-- Novia: cabeza -->
              <circle cx="8.5" cy="9" r="1.8" />
              <!-- Novia: velo (arco) -->
              <path fill="none" stroke="#ffffff" stroke-width="0.7" stroke-linecap="round"
                    d="M5.7 8.2 Q8.5 4.8 11.3 8.2" />
              <!-- Novia: vestido (triángulo A-line) -->
              <path d="M8.5 11 L5.3 22 L11.7 22 Z" />
              <!-- Novio: cabeza -->
              <circle cx="15.5" cy="9" r="1.8" />
              <!-- Novio: cuerpo (rectángulo) -->
              <path d="M13.6 11 L13.6 22 L17.4 22 L17.4 11 Z" />
              <!-- Novio: moño -->
              <path d="M14.4 11.6 L16.6 11.6 L15.5 12.6 Z" />
            </g>
          </svg>
        }

        @case ('subsidio-hijos') {
          <svg x="22" y="22" width="56" height="56" viewBox="0 0 24 24">
            <g fill="none" stroke="#ffffff" stroke-linecap="round" stroke-linejoin="round" stroke-width="2">
              <path d="M10 16c.5.3 1.2.5 2 .5s1.5-.2 2-.5m1-4h.01" />
              <path d="M19.38 6.813A9 9 0 0 1 20.8 10.2a2 2 0 0 1 0 3.6a9 9 0 0 1-17.6 0a2 2 0 0 1 0-3.6A9 9 0 0 1 12 3c2 0 3.5 1.1 3.5 2.5s-.9 2.5-2 2.5c-.8 0-1.5-.4-1.5-1m-3 5h.01" />
            </g>
          </svg>
        }

        @case ('subsidio-sepelio') {
          <svg x="22" y="22" width="56" height="56" viewBox="0 0 50 50">
            <path fill="#ffffff"
                  d="M25.242 2.089L1 23h6v25h36V23h6zM34 30h-7v12.088L26.954 42h-4.775l-.179.088V30h-6v-4h6v-9h5v9h7z" />
          </svg>
        }

        @case ('turismo') {
          <svg x="22" y="22" width="56" height="56" viewBox="0 0 24 24">
            <path fill="#ffffff"
                  d="M11 6h2V4h-2zm-2.625 5.213Q6.65 10.425 5 9.45V6h4V2h6v4h4v3.45q-1.65.975-3.375 1.763T12 12t-3.625-.788M7 22v-1H5v-9.3q1.4.85 2.888 1.45t3.112.8V15h2v-1.05q1.625-.2 3.113-.8T19 11.7V21h-2v1h-2v-1H9v1z" />
          </svg>
        }

        @case ('farmacia') {
          <!-- Ratio original 3:4 → mantenemos proporciones (42×56 dentro de 56×56) -->
          <svg x="29" y="22" width="42" height="56" viewBox="0 0 384 512">
            <path fill="#ffffff"
                  d="M0 32C0 14.3 14.3 0 32 0h320c17.7 0 32 14.3 32 32v32c0 17.7-14.3 32-32 32H32C14.3 96 0 81.7 0 64zm32 96h320v320c0 35.3-28.7 64-64 64H96c-35.3 0-64-28.7-64-64zm128 112v48h-48c-8.8 0-16 7.2-16 16v32c0 8.8 7.2 16 16 16h48v48c0 8.8 7.2 16 16 16h32c8.8 0 16-7.2 16-16v-48h48c8.8 0 16-7.2 16-16v-32c0-8.8-7.2-16-16-16h-48v-48c0-8.8-7.2-16-16-16h-32c-8.8 0-16 7.2-16 16" />
          </svg>
        }

        @case ('evacuacion') {
          <svg x="22" y="22" width="56" height="56" viewBox="0 0 24 24">
            <circle cx="8" cy="11" r="3" fill="#ffffff" />
            <path fill="#ffffff"
                  d="M18.205 7H12v8H4V6H2v14h2v-3h16v3h2v-4c0-.009-.005-.016-.005-.024H22V11c0-2.096-1.698-4-3.795-4" />
          </svg>
        }

        @case ('afiliacion') {
          <svg x="22" y="22" width="56" height="56" viewBox="0 0 24 24">
            <path fill="#ffffff"
                  d="m20 22.09l2.45 1.49l-.65-2.81l2.2-1.88l-2.89-.25L20 16l-1.13 2.64l-2.87.25l2.18 1.88l-.68 2.81zM14.08 21H2c-1.05 0-2-.95-2-2V5c0-1.05.95-2 2-2h20c1.05 0 2 .95 2 2v10.53A5.97 5.97 0 0 0 20 14c-3.31 0-6 2.69-6 6c0 .34.03.68.08 1M8 13.91C6 13.91 2 15 2 17v1h12v-1c0-2-4-3.09-6-3.09M8 6C6.35 6 5 7.35 5 9s1.35 3 3 3s3-1.35 3-3s-1.35-3-3-3m13 4h-7v1h7zm1-2h-8v1h8zm0-2h-8v1h8z" />
          </svg>
        }

        @case ('actualizacion-datos') {
          <svg x="22" y="22" width="56" height="56" viewBox="0 0 24 24">
            <path fill="#ffffff"
                  d="M6 22q-.825 0-1.412-.587T4 20V4q0-.825.588-1.412T6 2h8l6 6v3q-.575.125-1.075.4t-.925.7l-6 5.975V22zm8 0v-3.075l5.525-5.5q.225-.225.5-.325t.55-.1q.3 0 .575.113t.5.337l.925.925q.2.225.313.5t.112.55t-.1.563t-.325.512l-5.5 5.5zm6.575-5.6l.925-.975l-.925-.925l-.95.95zM13 9h5l-5-5l5 5l-5-5z" />
          </svg>
        }

        @case ('alta-familiar') {
          <svg x="22" y="22" width="56" height="56" viewBox="0 0 24 24">
            <path fill="#ffffff"
                  d="M18 6q-.825 0-1.412-.587T16 4t.588-1.412T18 2t1.413.588T20 4t-.587 1.413T18 6m-1 16V10.95h-1.825L16.5 7h3l3 9H20v6zm-5.562-10.937Q11 10.625 11 10t.438-1.062T12.5 8.5t1.063.438T14 10t-.437 1.063t-1.063.437t-1.062-.437M5.5 6q-.825 0-1.412-.587T3.5 4t.588-1.412T5.5 2t1.413.588T7.5 4t-.587 1.413T5.5 6m-2 16v-7H2V7h7v8H7.5v7zm7.5 0v-4h-1v-5.5h5V18h-1v4z" />
          </svg>
        }

        @case ('institucional') {
          <!-- Edificio con techo triangular y 4 columnas -->
          <svg x="22" y="22" width="56" height="56" viewBox="0 0 24 24">
            <g fill="#ffffff">
              <path d="M2 11 L12 4 L22 11 Z" />
              <rect x="3.5" y="11" width="2" height="8" />
              <rect x="8" y="11" width="2" height="8" />
              <rect x="14" y="11" width="2" height="8" />
              <rect x="18.5" y="11" width="2" height="8" />
              <rect x="2" y="19" width="20" height="2" />
            </g>
          </svg>
        }

        @case ('autoridades') {
          <!-- Tres figuras agrupadas -->
          <svg x="22" y="22" width="56" height="56" viewBox="0 0 24 24">
            <g fill="#ffffff">
              <circle cx="5.5" cy="9" r="2" />
              <path d="M2.5 19 C2.5 14.5, 8.5 14.5, 8.5 19 Z" />
              <circle cx="18.5" cy="9" r="2" />
              <path d="M15.5 19 C15.5 14.5, 21.5 14.5, 21.5 19 Z" />
              <circle cx="12" cy="7" r="2.4" />
              <path d="M7.5 21 C7.5 14.5, 16.5 14.5, 16.5 21 Z" />
            </g>
          </svg>
        }

        @case ('retirados') {
          <!-- Grupo de personas (jubilados y pensionados) -->
          <svg x="22" y="22" width="56" height="56" viewBox="0 0 26 24" preserveAspectRatio="xMidYMid meet">
            <path fill="#ffffff"
                  d="M22.313 17.295a7.44 7.44 0 0 0-4.089-2.754l-.051-.011l-1.179 1.99a1.003 1.003 0 0 1-1 1c-.55 0-1-.45-1.525-1.774v-.032a1.25 1.25 0 1 0-2.5 0v.033v-.002c-.56 1.325-1.014 1.774-1.563 1.774a1.003 1.003 0 0 1-1-1l-1.142-1.994a7.47 7.47 0 0 0-4.126 2.746l-.014.019a4.5 4.5 0 0 0-.655 2.197v.007c.005.15 0 .325 0 .5v2a2 2 0 0 0 2 2h15.5a2 2 0 0 0 2-2v-2c0-.174-.005-.35 0-.5a4.5 4.5 0 0 0-.666-2.221l.011.02zM7.968 5.29c0 2.92 1.82 7.21 5.25 7.21c3.37 0 5.25-4.29 5.25-7.21v-.065a5.25 5.25 0 1 0-10.5 0v.068zm11.234 1.72c0 1.902 1.186 4.698 3.42 4.698c2.195 0 3.42-2.795 3.42-4.698v-.052a3.421 3.421 0 0 0-6.842 0v.055v-.003zm-19.2 1.6c0 1.902 1.186 4.698 3.42 4.698c2.195 0 3.42-2.795 3.42-4.698v-.052a3.421 3.421 0 0 0-6.842 0v.055v-.003z" />
          </svg>
        }

        @case ('actividad') {
          <!-- Figura uniformada haciendo el saludo -->
          <svg x="22" y="22" width="56" height="56" viewBox="0 0 576 512" preserveAspectRatio="xMidYMid meet">
            <path fill="#ffffff"
                  d="M246.9 14.1C234 15.2 224 26 224 39c0 13.8 11.2 25 25 25h151c8.8 0 16-7.2 16-16V17.4c0-9.4-8-16.7-17.3-16zM240 112c0 44.2 35.8 80 80 80s80-35.8 80-80c0-5.5-.6-10.8-1.6-16H241.6c-1 5.2-1.6 10.5-1.6 16M72 224c-22.1 0-40 17.9-40 40s17.9 40 40 40h152v89.4l162.8-162.9c-13.3-4.3-27.3-6.5-41.6-6.5zm345.7 20.9L246.6 416H416v-46.3l53.6 90.6c11.2 19 35.8 25.3 54.8 14.1s25.3-35.8 14.1-54.8l-76.2-128.8c-11.2-18.9-26.6-34.5-44.6-45.9M224 448v32c0 17.7 14.3 32 32 32h128c17.7 0 32-14.3 32-32v-32z" />
          </svg>
        }

        @case ('hotel') {
          <!-- Edificio con ventanas y letrero -->
          <svg x="22" y="22" width="56" height="56" viewBox="0 0 24 24">
            <g>
              <rect x="3" y="6" width="18" height="15" fill="#ffffff" />
              <rect x="9" y="3" width="6" height="2.5" rx="0.3" fill="#ffffff" />
              <rect x="5" y="9" width="2" height="2" [attr.fill]="colorTo()" />
              <rect x="9" y="9" width="2" height="2" [attr.fill]="colorTo()" />
              <rect x="13" y="9" width="2" height="2" [attr.fill]="colorTo()" />
              <rect x="17" y="9" width="2" height="2" [attr.fill]="colorTo()" />
              <rect x="5" y="13" width="2" height="2" [attr.fill]="colorTo()" />
              <rect x="9" y="13" width="2" height="2" [attr.fill]="colorTo()" />
              <rect x="13" y="13" width="2" height="2" [attr.fill]="colorTo()" />
              <rect x="17" y="13" width="2" height="2" [attr.fill]="colorTo()" />
              <rect x="10" y="17" width="4" height="4" [attr.fill]="colorTo()" />
            </g>
          </svg>
        }

        @case ('bienestar') {
          <!-- Corazón grande -->
          <svg x="22" y="22" width="56" height="56" viewBox="0 0 24 24">
            <path fill="#ffffff"
                  d="M12 21 C 12 21, 4 15.5, 4 9.5 C 4 6.5, 6.2 4.5, 8.5 4.5 C 10 4.5, 11.5 5.5, 12 7 C 12.5 5.5, 14 4.5, 15.5 4.5 C 17.8 4.5, 20 6.5, 20 9.5 C 20 15.5, 12 21, 12 21 Z" />
          </svg>
        }

        @case ('comunicacion') {
          <!-- Megáfono -->
          <svg x="22" y="22" width="56" height="56" viewBox="0 0 24 24">
            <g fill="#ffffff">
              <path d="M3 10 L3 14 L9 14 L19 19 L19 5 L9 10 Z" />
              <path d="M21 8 Q22.8 9.5, 22.8 12 Q22.8 14.5, 21 16"
                    fill="none" stroke="#ffffff" stroke-width="1.4" stroke-linecap="round" />
            </g>
          </svg>
        }

        @case ('electoral') {
          <!-- Urna con papeleta -->
          <svg x="22" y="22" width="56" height="56" viewBox="0 0 24 24">
            <g>
              <rect x="4" y="10" width="16" height="11" rx="0.6" fill="#ffffff" />
              <rect x="9" y="12" width="6" height="1.6" rx="0.3" [attr.fill]="colorTo()" />
              <rect x="10" y="3" width="4" height="9" fill="#ffffff" />
              <rect x="11" y="5" width="2" height="0.6" [attr.fill]="colorTo()" />
              <rect x="11" y="7" width="2" height="0.6" [attr.fill]="colorTo()" />
              <rect x="11" y="9" width="2" height="0.6" [attr.fill]="colorTo()" />
            </g>
          </svg>
        }

        @case ('fiscalizadora') {
          <!-- Documento con lupa -->
          <svg x="22" y="22" width="56" height="56" viewBox="0 0 24 24">
            <g>
              <rect x="3" y="3" width="11" height="14" rx="0.5" fill="#ffffff" />
              <rect x="5" y="6" width="7" height="0.9" [attr.fill]="colorTo()" />
              <rect x="5" y="8" width="7" height="0.9" [attr.fill]="colorTo()" />
              <rect x="5" y="10" width="5" height="0.9" [attr.fill]="colorTo()" />
              <circle cx="16" cy="16" r="4.2" fill="none" stroke="#ffffff" stroke-width="1.8" />
              <line x1="19" y1="19" x2="22" y2="22" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" />
            </g>
          </svg>
        }

        @case ('presidencia') {
          <!-- Estrella de 5 puntas -->
          <svg x="22" y="22" width="56" height="56" viewBox="0 0 24 24">
            <path fill="#ffffff"
                  d="M12 3 L14.3 9 L21 9.5 L15.8 13.8 L17.5 20.5 L12 16.8 L6.5 20.5 L8.2 13.8 L3 9.5 L9.7 9 Z" />
          </svg>
        }

        @case ('presupuesto') {
          <!-- Gráfico de barras ascendente -->
          <svg x="22" y="22" width="56" height="56" viewBox="0 0 24 24">
            <g fill="#ffffff">
              <rect x="4" y="14" width="3" height="6" rx="0.4" />
              <rect x="9" y="10" width="3" height="10" rx="0.4" />
              <rect x="14" y="6" width="3" height="14" rx="0.4" />
              <rect x="3" y="20" width="18" height="1.4" rx="0.3" />
              <!-- flecha ascendente -->
              <path d="M19 4 L22 7 L20.5 7 L20.5 10 L17.5 10 L17.5 7 L16 7 Z" opacity="0.85" />
            </g>
          </svg>
        }

        @case ('protocolo') {
          <!-- Medalla con cinta -->
          <svg x="22" y="22" width="56" height="56" viewBox="0 0 24 24">
            <g>
              <path fill="#ffffff" d="M8 2 L12 10 L16 2 L14 2 L12 5.5 L10 2 Z" />
              <circle cx="12" cy="15" r="5.5" fill="#ffffff" />
              <circle cx="12" cy="15" r="3" [attr.fill]="colorTo()" />
              <path fill="#ffffff"
                    d="M12 12.3 L12.7 14 L14.4 14.1 L13.1 15.2 L13.5 16.9 L12 16 L10.5 16.9 L10.9 15.2 L9.6 14.1 L11.3 14 Z" />
            </g>
          </svg>
        }

        @case ('recepcion') {
          <!-- Campana de mostrador -->
          <svg x="22" y="22" width="56" height="56" viewBox="0 0 24 24">
            <g fill="#ffffff">
              <rect x="2.5" y="17" width="19" height="2.2" rx="0.3" />
              <path d="M6 17 C 6 11, 18 11, 18 17 Z" />
              <circle cx="12" cy="9" r="1.4" />
              <line x1="12" y1="7.5" x2="12" y2="10.2" stroke="#ffffff" stroke-width="1.2" />
            </g>
          </svg>
        }

        @case ('rrhh') {
          <!-- Dos personas + engranaje -->
          <svg x="22" y="22" width="56" height="56" viewBox="0 0 24 24">
            <g>
              <circle cx="8" cy="8" r="2.2" fill="#ffffff" />
              <path fill="#ffffff" d="M4 18 C4 13, 12 13, 12 18 Z" />
              <circle cx="16" cy="8" r="2.2" fill="#ffffff" />
              <path fill="#ffffff" d="M12 18 C12 13, 20 13, 20 18 Z" opacity="0.85" />
              <!-- engranaje abajo derecho -->
              <g transform="translate(16,18)">
                <circle r="2.3" fill="#ffffff" />
                <circle r="0.9" [attr.fill]="colorTo()" />
              </g>
            </g>
          </svg>
        }

        @case ('secretaria') {
          <!-- Clipboard / portapapeles -->
          <svg x="22" y="22" width="56" height="56" viewBox="0 0 24 24">
            <g>
              <rect x="5" y="4" width="14" height="17" rx="1" fill="#ffffff" />
              <rect x="9" y="2.5" width="6" height="3.5" rx="0.5" [attr.fill]="colorTo()" />
              <rect x="8" y="10" width="8" height="0.9" [attr.fill]="colorTo()" />
              <rect x="8" y="12.5" width="8" height="0.9" [attr.fill]="colorTo()" />
              <rect x="8" y="15" width="6" height="0.9" [attr.fill]="colorTo()" />
            </g>
          </svg>
        }
      }
    </g>
  </svg>
</div>
