<header class="relative overflow-hidden" [class.header-mobile-open]="isMenuOpen">
  <!-- Fondo SVG full-bleed - Mantenemos el hermoso diseño -->
  <svg
    class="absolute inset-0 w-full h-full pointer-events-none"
    viewBox="0 0 1440 490"
    preserveAspectRatio="none"
    aria-hidden="true"
  >
    <defs>
      <linearGradient id="gradient" x1="0%" y1="53%" x2="100%" y2="47%">
        <stop offset="5%" stop-color="#00c854" />
        <stop offset="95%" stop-color="#00b8db" />
      </linearGradient>
    </defs>
    <path
      d="M 0,500 L 0,262 C 117.33333333333331,268.5333333333333 234.66666666666663,275.06666666666666 411,246 C 587.3333333333334,216.93333333333334 822.6666666666667,152.26666666666665 1004,124 C 1185.3333333333333,95.73333333333333 1312.6666666666665,103.86666666666667 1440,112 L 1440,500 L 0,500 Z"
      fill="url(#gradient)"
      transform="rotate(-180 720 250)"
    />
  </svg>

  <!-- Contenido de la navbar -->
  <div class="relative">
    <div class="navbar bg-transparent">
      <div class="container mx-auto flex items-center justify-between px-5 py-5">
        
        <!-- Logo -->
        <div class="flex-shrink-0">
          <button 
            class="focus:outline-none transition-transform duration-200 hover:scale-105"
            (click)="navigateToHome()"
            aria-label="Ir al inicio">
            <img class="w-30 h-auto" src="cirsublogo.png" alt="CIRSUB Logo">
          </button>
        </div>

        <!-- Menú Desktop (oculto en móvil) -->
        <div class="hidden md:flex">
          <ul class="menu menu-horizontal px-1 text-white">
            <li><button (click)="navigateToHome()" class="hover:text-gray-200 transition-colors duration-200 bg-transparent border-none cursor-pointer">Inicio</button></li>
            <li><button (click)="navigateToFiliales()" class="hover:text-gray-200 transition-colors duration-200 bg-transparent border-none cursor-pointer">Filiales</button></li>
            <li><button (click)="navigateToContacto()" class="hover:text-gray-200 transition-colors duration-200 bg-transparent border-none cursor-pointer">Contacto</button></li>
          </ul>
        </div>

        <!-- Botón Hamburguesa (visible solo en móvil) -->
        <button 
          class="md:hidden flex flex-col items-center justify-center w-8 h-8 text-white hover:text-gray-200 transition-colors duration-200"
          (click)="toggleMenu()"
          [attr.aria-expanded]="isMenuOpen"
          aria-label="Abrir menú de navegación">
          
          <!-- Líneas del hamburger con animación -->
          <span class="hamburger-line" [class.hamburger-line-1-open]="isMenuOpen"></span>
          <span class="hamburger-line" [class.hamburger-line-2-open]="isMenuOpen"></span>
          <span class="hamburger-line" [class.hamburger-line-3-open]="isMenuOpen"></span>
        </button>
      </div>
    </div>

    <!-- Menú Móvil Desplegable -->
    <div class="mobile-menu" [class.mobile-menu-open]="isMenuOpen">
      <div class="mobile-menu-backdrop" (click)="closeMenu()"></div>
      <nav class="mobile-menu-content">
        <ul class="mobile-menu-list">
          <li>
            <button 
               class="mobile-menu-item w-full text-left"
               (click)="navigateAndCloseMenu('/')">
              <span class="mobile-menu-icon">🏠</span>
              Inicio
            </button>
          </li>
          <li>
            <button 
               class="mobile-menu-item w-full text-left"
               (click)="navigateAndCloseMenu('/filiales')">
              <span class="mobile-menu-icon">📍</span>
              Filiales
            </button>
          </li>
          <li>
            <button 
               class="mobile-menu-item w-full text-left"
               (click)="navigateAndCloseMenu('/contacto')">
              <span class="mobile-menu-icon">📞</span>
              Contacto
            </button>
          </li>
        </ul>
      </nav>
    </div>
  </div>
</header>
