<main class="container mx-auto px-4 py-12">
  <header class="text-center mb-12">
    <h1 class="text-3xl md:text-4xl font-bold text-green-700 mb-3">Contacto</h1>
    <p class="max-w-2xl mx-auto text-gray-600">
      Contactate con el departamento que estás buscando.
    </p>
  </header>

  <section class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6 max-w-6xl mx-auto">
    @for (dep of departamentos; track dep.email) {
      <article class="bg-white rounded-2xl shadow-md hover:shadow-xl transition-all duration-300 overflow-hidden border border-gray-100 flex flex-col group hover:-translate-y-1">
        <div class="aspect-[5/3] overflow-hidden bg-gradient-to-br from-gray-50 to-gray-100 flex items-center justify-center p-4">
          <app-icon-illustration [name]="dep.icono" />
        </div>
        <div class="p-5 flex-1 flex flex-col text-center">
          <h3 class="text-lg font-semibold text-gray-800 mb-2 group-hover:text-green-700 transition-colors">
            {{ dep.nombre }}
          </h3>
          <a [href]="'mailto:' + dep.email" class="text-green-700 hover:text-green-800 text-sm break-all">
            {{ dep.email }}
          </a>
          @if (dep.telefono) {
            <p class="text-sm text-gray-600 mt-1">
              📞 {{ dep.telefono }}@if (dep.interno) { <span> · int. {{ dep.interno }}</span> }
            </p>
          }
        </div>
      </article>
    }
  </section>
</main>
