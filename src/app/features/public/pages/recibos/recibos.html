<main class="container mx-auto px-4 py-12">
  <header class="text-center mb-12">
    <h1 class="text-3xl md:text-4xl font-bold text-green-700 mb-3">Consulta de Recibos</h1>
    <p class="max-w-2xl mx-auto text-gray-600">
      Seleccioná el portal según tu situación de revista.
    </p>
  </header>

  <section class="grid grid-cols-1 sm:grid-cols-2 gap-8 max-w-3xl mx-auto">
    @for (p of portales; track p.url) {
      <a [href]="p.url" target="_blank" rel="noopener noreferrer"
         class="group block rounded-2xl overflow-hidden bg-white shadow-md hover:shadow-2xl transition-all duration-300 transform hover:-translate-y-2 border border-gray-100 cursor-pointer relative">

        <!-- Indicador 'externo' -->
        <span class="absolute top-3 right-3 z-10 inline-flex items-center justify-center w-8 h-8 rounded-full bg-white/80 backdrop-blur shadow opacity-0 group-hover:opacity-100 transition-all duration-300">
          <svg class="w-4 h-4 text-gray-700" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M7 17 17 7M7 7h10v10" />
          </svg>
        </span>

        <div class="aspect-[4/3] overflow-hidden bg-gradient-to-br from-gray-50 to-gray-100 flex items-center justify-center p-4">
          <app-icon-illustration [name]="p.icono" />
        </div>

        <div class="p-6 text-center">
          <h3 class="text-xl font-semibold text-gray-800 group-hover:text-green-700 transition-colors mb-2">
            {{ p.titulo }}
          </h3>
          <p class="text-sm text-gray-500">{{ p.descripcion }}</p>
          <span class="block text-xs text-green-600 font-medium mt-3 opacity-0 group-hover:opacity-100 transition-opacity duration-300">
            Abrir portal →
          </span>
        </div>
      </a>
    }
  </section>
</main>
