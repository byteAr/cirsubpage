<main class="container mx-auto px-4 py-12">
  <header class="text-center mb-12">
    <h1 class="text-3xl md:text-4xl font-bold text-green-700 mb-3">Trámites</h1>
    <p class="max-w-2xl mx-auto text-gray-600">
      Gestioná online tus trámites como socio de la Mutual.
    </p>
  </header>

  <section class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-8 max-w-6xl mx-auto">
    @for (t of tramites; track t.id) {
      <app-service-card
        [titulo]="t.titulo"
        [icono]="t.icono"
        [imagen]="t.imagen"
        [ruta]="t.ruta"
        [descripcion]="t.descripcion" />
    }
  </section>
</main>
