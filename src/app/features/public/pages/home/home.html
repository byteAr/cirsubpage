<main>
  <!-- Carrusel de Noticias -->
  <section class="mb-12">
    <app-news-carousel
      [newsItems]="newsItems"
      [autoPlayInterval]="3000"
      [enableAutoPlay]="true">
    </app-news-carousel>

    <!-- Accesos directos a los sistemas externos -->
    <div class="mt-8 px-4 flex flex-col sm:flex-row items-stretch sm:items-center justify-center gap-4">
      <a
        href="https://credencial.cirsubgn.org.ar"
        target="_blank"
        rel="noopener noreferrer"
        class="inline-flex items-center justify-center gap-2 rounded-2xl bg-green-600 px-7 py-4 text-base font-bold text-white shadow-lg transition-all duration-300 hover:bg-green-700 hover:shadow-xl focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-green-700">
        <svg class="w-5 h-5 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="2.8" y="4.8" width="18.4" height="14.4" rx="2.4"/>
          <circle cx="8.6" cy="11" r="2.1"/>
          <path d="M5.2 16.4a3.7 3.7 0 0 1 6.8 0"/>
          <path d="M14.6 10h4.2"/><path d="M14.6 13.4h4.2"/>
        </svg>
        Ir a la Credencial Digital
      </a>

      <a
        href="https://admin.cirsubgn.org.ar"
        target="_blank"
        rel="noopener noreferrer"
        class="inline-flex items-center justify-center gap-2 rounded-2xl border-2 border-green-600 bg-white px-7 py-4 text-base font-bold text-green-700 shadow-lg transition-all duration-300 hover:bg-green-50 hover:shadow-xl focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-green-700">
        <svg class="w-5 h-5 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M12 15.2a3.2 3.2 0 1 0 0-6.4 3.2 3.2 0 0 0 0 6.4z"/>
          <path d="M19.4 14.6a1.6 1.6 0 0 0 .32 1.76l.06.06a1.9 1.9 0 1 1-2.7 2.7l-.06-.06a1.6 1.6 0 0 0-1.76-.32 1.6 1.6 0 0 0-.97 1.47V21a1.9 1.9 0 0 1-3.8 0v-.1a1.6 1.6 0 0 0-1.05-1.47 1.6 1.6 0 0 0-1.76.32l-.06.06a1.9 1.9 0 1 1-2.7-2.7l.06-.06a1.6 1.6 0 0 0 .32-1.76 1.6 1.6 0 0 0-1.47-.97H3a1.9 1.9 0 0 1 0-3.8h.1a1.6 1.6 0 0 0 1.47-1.05 1.6 1.6 0 0 0-.32-1.76l-.06-.06a1.9 1.9 0 1 1 2.7-2.7l.06.06a1.6 1.6 0 0 0 1.76.32H8.8a1.6 1.6 0 0 0 .97-1.47V3a1.9 1.9 0 0 1 3.8 0v.1a1.6 1.6 0 0 0 .97 1.47 1.6 1.6 0 0 0 1.76-.32l.06-.06a1.9 1.9 0 1 1 2.7 2.7l-.06.06a1.6 1.6 0 0 0-.32 1.76v.08a1.6 1.6 0 0 0 1.47.97H21a1.9 1.9 0 0 1 0 3.8h-.1a1.6 1.6 0 0 0-1.47.97z"/>
        </svg>
        Ir a sistema de Gestión
      </a>
    </div>
  </section>

  <!-- Sección del Mapa de Argentina -->
  <section class="my-12 px-4 sm:px-6 lg:px-8">
    <div class="max-w-6xl mx-auto">
      <div class="text-center mb-8">
        <h2 class="text-3xl font-bold text-gray-900 mb-4 text-teal-600">La mutual siempre cerca</h2>
        <p class="text-lg max-w-2xl mx-auto text-gray-400">
          Conoce más acerca de nuestras 20 filiales desplegadas en todo el país.
        </p>
      </div>
      
      <div class="bg-white rounded-2xl shadow-lg p-6 sm:p-8">
        <div class="relative overflow-hidden rounded-xl">
          <!-- Contenedor del mapa con altura limitada -->
          <div class="h-96 overflow-hidden relative">
            <app-argentina-map
              [sucursales]="sucursales"
              [logoUrl]="'cirsublogo.png'"
              [showLegend]="false"
              [legendTitle]="'Sucursales CIRSUB'"
              [containerClass]="'map-container'"
              [enableTooltips]="false"
              [enablePulse]="true">
            </app-argentina-map>
          </div>
          
          <!-- Degradado de ocultamiento de abajo hacia arriba -->
          <div class="absolute bottom-0 left-0 right-0 h-24 bg-gradient-to-t from-white to-transparent pointer-events-none"></div>
        </div>
        
        <!-- Carrusel de filiales -->
        <div class="mt-12 mb-8">
          <app-filiales-carousel [filialesItems]="filialesItems"></app-filiales-carousel>
        </div>
        
        <!-- Botón para conocer las filiales -->
        <div class="text-center mt-6 flex justify-center">
          <button 
            class="flex items-center justify-center gap-2 px-6 py-3 bg-green-600 hover:bg-green-700 text-white font-semibold rounded-xl shadow-lg hover:shadow-xl transition-all duration-300 transform hover:scale-105"
            (click)="navigateToFiliales()">
            <span class="flex items-center gap-2">
              <svg xmlns="http://www.w3.org/2000/svg" width="30" height="30" viewBox="0 0 24 24"><g fill="none"><path stroke="#ffffff" stroke-linecap="round" stroke-width="1.5" d="M22 22H2"/><path stroke="#ffffff" stroke-width="1.5" d="M17 22V6c0-1.886 0-2.828-.586-3.414S14.886 2 13 2h-2c-1.886 0-2.828 0-3.414.586S7 4.114 7 6v16"/><path fill="#ffffff" d="M20.25 11.5a.75.75 0 0 0 1.5 0zm-.139-3.163l-.416.624zm.552.552l-.624.417zM21.75 15.5a.75.75 0 0 0-1.5 0zM17.5 8.75c.718 0 1.2 0 1.567.038c.355.036.519.1.628.173l.833-1.248c-.396-.264-.835-.369-1.309-.417c-.461-.047-1.032-.046-1.719-.046zm4.25 2.75c0-.687 0-1.258-.046-1.719c-.048-.473-.153-.913-.418-1.309l-1.247.834c.073.108.137.272.173.627c.037.367.038.85.038 1.567zm-2.055-2.54q.206.14.344.346l1.247-.834c-.2-.3-.458-.558-.758-.759zm.555 6.54V22h1.5v-6.5zM3.889 8.337l.417.624zm-.552.552l.624.417zM3.75 20a.75.75 0 0 0-1.5 0zm-1.5-4a.75.75 0 0 0 1.5 0zM6.5 7.25c-.687 0-1.258 0-1.719.046c-.473.048-.913.153-1.309.417l.834 1.248c.108-.073.272-.137.627-.173c.367-.037.85-.038 1.567-.038zM3.75 11.5c0-.718 0-1.2.038-1.567c.036-.355.1-.519.173-.627l-1.248-.834c-.264.396-.369.836-.417 1.309c-.047.461-.046 1.032-.046 1.719zm-.278-3.787a2.8 2.8 0 0 0-.759.76l1.248.833a1.3 1.3 0 0 1 .345-.345zM2.25 20v2h1.5v-2zm0-8.5V16h1.5v-4.5z"/><path stroke="#ffffff" stroke-linecap="round" stroke-width="1.5" d="M12 22v-3M10 5h4m-4 9h.5m3.5 0h-1.5M14 8h-.5M10 8h1.5M10 11h4"/></g></svg>
            </span>
            Conocer las filiales
          </button>
        </div>
      </div>
    </div>
  </section>

</main>
