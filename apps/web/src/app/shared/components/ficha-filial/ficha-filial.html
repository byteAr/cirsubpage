<div class="fondo" (click)="cerrar.emit()" role="presentation">
  <div class="ventana" (click)="$event.stopPropagation()" role="dialog" aria-modal="true"
       [attr.aria-label]="filial().nombre">

    <button type="button" class="cerrar" (click)="cerrar.emit()" aria-label="Cerrar la ficha">✕</button>

    <div class="portada">
      @if (filial().fotoUrl) {
        <img [src]="filial().fotoUrl" [alt]="filial().nombre" decoding="async" />
      } @else {
        <div class="portada-vacia" aria-hidden="true">
          <img src="cirsublogo-chico.webp" alt="" width="72" height="72" />
        </div>
      }
      <svg class="portada-onda" viewBox="0 0 600 60" preserveAspectRatio="none" aria-hidden="true">
        <path d="M0,40 C100,18 200,18 300,40 C400,62 500,62 600,40 L600,60 L0,60 Z" fill="#FFFFFF"></path>
      </svg>
    </div>

    <div class="cuerpo">
      <span class="etiqueta">Filial</span>
      <h2>{{ filial().nombre }}</h2>

      <dl class="datos">
        @if (filial().direccion) {
          <div>
            <dt>
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
                   stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M19 10.2c0 5.2-7 11-7 11s-7-5.8-7-11a7 7 0 1 1 14 0z"/><circle cx="12" cy="10" r="2.6"/>
              </svg>
              Dirección
            </dt>
            <dd>{{ filial().direccion }}</dd>
          </div>
        }

        @if (filial().telefono) {
          <div>
            <dt>
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
                   stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M6.5 3h3l1.5 4-2 1.4a12 12 0 0 0 5.6 5.6l1.4-2 4 1.5v3a2 2 0 0 1-2.2 2A16.5 16.5 0 0 1 4.5 5.2 2 2 0 0 1 6.5 3z"/>
              </svg>
              Teléfono
            </dt>
            <dd><a [href]="'tel:' + telefonoLimpio()">{{ filial().telefono }}</a></dd>
          </div>
        }

        @if (filial().email) {
          <div>
            <dt>
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
                   stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <rect x="2.8" y="5" width="18.4" height="14" rx="2"/><path d="m3.6 6.4 8.4 6.2 8.4-6.2"/>
              </svg>
              Correo
            </dt>
            <dd><a [href]="'mailto:' + filial().email">{{ filial().email }}</a></dd>
          </div>
        }
      </dl>

      <div class="acciones">
        <a [href]="enlaceMapa()" target="_blank" rel="noopener noreferrer" class="boton-primario">
          Cómo llegar
        </a>
        @if (filial().telefono) {
          <a [href]="'tel:' + telefonoLimpio()" class="boton-secundario">Llamar</a>
        }
      </div>
    </div>
  </div>
</div>
