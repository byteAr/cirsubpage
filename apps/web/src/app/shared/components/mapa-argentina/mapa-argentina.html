<div class="mapa-contenedor" #contenedor [class.animando]="animando()">
  <svg [attr.viewBox]="'0 0 ' + ancho + ' ' + alto"
       class="mapa-svg"
       role="img"
       aria-label="Mapa de la Argentina con las filiales de la mutual">

    <image [attr.href]="mapa" x="0" y="0" [attr.width]="ancho" [attr.height]="alto"
           class="mapa-dibujo" />

    <g class="capa-pines">
      @for (filial of filiales(); track filial.id) {
        <g class="pin" [attr.transform]="transformacion(filial)">
          <!--
            Pulso infinito. Se conserva exactamente del sitio anterior:
            escala 1 → 2.25, opacidad 0.8 → 0, dos segundos.
            Los veinte laten a la vez: sin desfase, el mapa late como una sola
            pieza en lugar de titilar de a uno.
          -->
          <circle r="20" fill="none" stroke="#00B24A" stroke-width="2"
                  vector-effect="non-scaling-stroke"
                  class="pin-pulso" />

          <g class="pin-logo"
             [class.pin-interactivo]="interactivo()"
             (click)="alElegir(filial)"
             (mouseenter)="alEntrar(filial.id)"
             (mouseleave)="alSalir()"
             [attr.tabindex]="interactivo() ? 0 : null"
             [attr.role]="interactivo() ? 'button' : null"
             [attr.aria-label]="interactivo() ? filial.nombre : null"
             (keydown.enter)="alElegir(filial)">
            <circle r="25" fill="transparent" />
            <image [attr.href]="logo()" x="-20" y="-20" width="40" height="40" />
          </g>
        </g>
      }
    </g>

    @if (filialActiva(); as filial) {
      <g class="cartel" [attr.transform]="'translate(' + posicionCartel(filial).x + ',' + posicionCartel(filial).y + ')'">
        <rect width="250" height="78" rx="16" fill="#16303F" opacity="0.96" />
        <text x="18" y="30" fill="#FFFFFF" font-size="15" font-weight="600">{{ filial.nombre }}</text>
        @if (filial.direccion) {
          <text x="18" y="52" fill="#9FB4C2" font-size="13">{{ filial.direccion }}</text>
        }
        <text x="18" y="68" fill="#2FBF8F" font-size="12" font-weight="600">Tocá para ver la ficha</text>
      </g>
    }
  </svg>
</div>
