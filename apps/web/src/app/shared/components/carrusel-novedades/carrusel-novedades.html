@if (slides().length > 0) {
  <section class="carrusel"
           [class.detenido]="detenido()"
           (mouseenter)="pausar()"
           (mouseleave)="reanudar()"
           (touchstart)="alTocarInicio($event)"
           (touchend)="alTocarFin($event)"
           aria-roledescription="carrusel"
           aria-label="Novedades destacadas">

    <div class="carrusel-fondo" aria-hidden="true"></div>

    <div class="contenedor carrusel-cuerpo">
      @for (slide of visible(); track slide.id) {
        <div class="carrusel-texto" [attr.data-clave]="slide.id">
          @if (slide.volanta) {
            <span class="volanta">{{ slide.volanta }}</span>
          }
          <h1 class="titulo titulo-degradado">{{ slide.titulo }}</h1>
          @if (slide.bajada) {
            <p class="bajada">{{ slide.bajada }}</p>
          }
          <a [routerLink]="['/novedades', slide.slug]" class="boton-leer">
            Más detalles
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                 stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M5 12h14M13 6l6 6-6 6"/>
            </svg>
          </a>
        </div>

        <div class="carrusel-imagen" [attr.data-clave]="slide.id">
          <figure>
            @if (slide.imagen; as img) {
              <picture>
                @if (img.avif) { <source [srcset]="img.avif" type="image/avif" sizes="(max-width: 900px) 92vw, 46vw" /> }
                @if (img.webp) { <source [srcset]="img.webp" type="image/webp" sizes="(max-width: 900px) 92vw, 46vw" /> }
                <img [src]="img.original" [alt]="img.alt || slide.titulo"
                     width="1024" height="768" fetchpriority="high" decoding="async" />
              </picture>
            } @else {
              <div class="imagen-vacia" aria-hidden="true"></div>
            }
          </figure>
        </div>
      }
    </div>

    @if (slides().length > 1) {
      <div class="contenedor carrusel-controles">
        <!--
          Cada marca es una pista; la de la novedad en pantalla se va llenando
          y al completarse pasa a la siguiente.
        -->
        <div class="puntos" role="tablist" aria-label="Elegir novedad">
          @for (s of slides(); track s.id; let i = $index) {
            <button type="button" role="tab" class="punto"
                    [class.punto-activo]="i === indice()"
                    [attr.aria-selected]="i === indice()"
                    [attr.aria-label]="'Novedad ' + (i + 1)"
                    (click)="irA(i)">
              <span class="relleno" aria-hidden="true"
                    [class.corriendo]="i === indice() && avanzaSolo()"
                    [style.animationDuration.ms]="intervalo()"
                    (animationend)="alCompletar()"></span>
            </button>
          }
        </div>

        <div class="flechas">
          <span class="contador">{{ contador() }}</span>
          <button type="button" (click)="anterior()" aria-label="Novedad anterior">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                 stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M19 12H5M11 18l-6-6 6-6"/>
            </svg>
          </button>
          <button type="button" (click)="siguiente()" aria-label="Novedad siguiente">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                 stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M5 12h14M13 6l6 6-6 6"/>
            </svg>
          </button>
        </div>
      </div>
    }
  </section>
}
