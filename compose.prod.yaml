# Producción sobre el Debian.
#
# No levanta nginx ni toca los puertos 80 y 443: el nginx del sistema ya sirve
# la credencial y el sistema de gestión. Acá todo queda publicado en la interfaz
# local y el nginx existente hace de intermediario.

# El nombre va fijo. Sin esto sale del nombre de la carpeta, y de él dependen
# los nombres de los volúmenes: nginx sirve los medios leyendo directamente de
# `cirsub_medios`, así que la ruta tiene que ser estable.
name: cirsub

services:
  postgres:
    image: postgres:17-alpine
    container_name: cirsub-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      TZ: America/Argentina/Buenos_Aires
    # Sin `ports`: la base solo se alcanza desde la red interna del compose.
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 15s
      timeout: 5s
      retries: 5
    networks: [cirsub]

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    image: cirsub-api:latest
    container_name: cirsub-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3400
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      # El dominio sale del .env, así el mismo archivo sirve para test y para
      # producción. La API vive en /api del propio sitio: mismo origen, sin
      # CORS y con la cookie atada al sitio.
      URL_SITIO: ${URL_SITIO}
      URL_API: ${URL_SITIO}/api
      URL_MEDIOS: ${URL_SITIO}/medios
      ORIGENES_PERMITIDOS: ${URL_SITIO}
      PROXIES_CONFIABLES: 1
      # Vacío a propósito: sin dominio declarado la cookie queda atada al sitio
      # y no viaja al resto de los subdominios.
      COOKIE_DOMINIO: ''
      JWT_SECRET: ${JWT_SECRET}
      STORAGE_RAIZ: /app/storage
      CORREO_HABILITADO: 'true'
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PUERTO: ${SMTP_PUERTO}
      SMTP_USUARIO: ${SMTP_USUARIO}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_REMITENTE: ${SMTP_REMITENTE}
      SMTP_RESPONDER_A: ${SMTP_RESPONDER_A}
    volumes:
      - medios:/app/storage
    ports:
      - '127.0.0.1:3400:3400'
    networks: [cirsub]

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    image: cirsub-web:latest
    container_name: cirsub-web
    restart: unless-stopped
    depends_on: [api]
    environment:
      NODE_ENV: production
      PORT: 4400
      # El renderizado en servidor no puede resolver una ruta relativa, así que
      # llama a la API por la red interna: no sale a internet ni pasa por nginx
      # para pedirse datos a sí mismo.
      API_INTERNA: http://api:3400/api
    ports:
      - '127.0.0.1:4400:4400'
    networks: [cirsub]

volumes:
  pgdata:
  # Los medios los sirve nginx directo desde este volumen, no Node.
  medios:

networks:
  cirsub:
    driver: bridge
