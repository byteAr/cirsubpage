# Producción sobre el Debian.
#
# No levanta nginx ni toca los puertos 80 y 443: el nginx del sistema ya sirve
# la credencial y el sistema de gestión. Acá todo queda publicado en la interfaz
# local y el nginx existente hace de intermediario.

services:
  postgres:
    image: postgres:17-alpine
    container_name: cirsub-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      TZ: America/Argentina/Buenos_Aires
    # Sin `ports`: la base solo se alcanza desde la red interna del compose.
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 15s
      timeout: 5s
      retries: 5
    networks: [cirsub]

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    image: cirsub-api:latest
    container_name: cirsub-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3400
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      URL_SITIO: https://cirsubgn.org.ar
      URL_API: https://apipage.cirsubgn.org.ar
      URL_MEDIOS: https://cirsubgn.org.ar/medios
      ORIGENES_PERMITIDOS: https://cirsubgn.org.ar,https://www.cirsubgn.org.ar
      PROXIES_CONFIABLES: 1
      COOKIE_DOMINIO: .cirsubgn.org.ar
      JWT_SECRET: ${JWT_SECRET}
      STORAGE_RAIZ: /app/storage
      CORREO_HABILITADO: 'true'
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PUERTO: ${SMTP_PUERTO}
      SMTP_USUARIO: ${SMTP_USUARIO}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_REMITENTE: ${SMTP_REMITENTE}
      SMTP_RESPONDER_A: ${SMTP_RESPONDER_A}
    volumes:
      - medios:/app/storage
    ports:
      - '127.0.0.1:3400:3400'
    networks: [cirsub]

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    image: cirsub-web:latest
    container_name: cirsub-web
    restart: unless-stopped
    depends_on: [api]
    environment:
      NODE_ENV: production
      PORT: 4400
    ports:
      - '127.0.0.1:4400:4400'
    networks: [cirsub]

volumes:
  pgdata:
  # Los medios los sirve nginx directo desde este volumen, no Node.
  medios:

networks:
  cirsub:
    driver: bridge
